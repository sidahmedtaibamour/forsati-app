name: Collect and publish
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect opportunities
        continue-on-error: true
        run: node collect.mjs
      - name: Save collected data
        run: |
          git config user.name "forsati-bot"
          git config user.email "forsati-bot@users.noreply.github.com"
          git add opportunities.json status.json
          git diff --cached --quiet || (git commit -m "data: update $(date -u +%F-%H%M)" && git push)
      - name: Prepare site files
        run: |
          mkdir -p _site
          cp index.html style.css app.js auth.js sw.js manifest.json icon* privacy.* opportunities.json status.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
